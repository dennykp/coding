<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#047857">
<meta name="description" content="Verifikasi dan disposisi surat UNISMA dari ponsel.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIMPERA">
<title>SIMPERA v2 Mobile</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/app.css?v=ab13b213fc">
</head>
<body class="h-full bg-canvas text-slate-700 antialiased">

<!-- ===================== MASUK ===================== -->
<section id="m-login" class="hidden min-h-full">
  <div class="relative min-h-screen overflow-hidden bg-brand-700 px-6 pb-10 pt-16 text-white">
    <div class="pointer-events-none absolute -right-20 -top-24 h-72 w-72 rounded-full border-[32px] border-white/10"></div>
    <div class="pointer-events-none absolute -left-16 top-56 h-56 w-56 rounded-full border-[24px] border-white/5"></div>

    <div class="relative">
      <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white/15 ring-1 ring-white/25 backdrop-blur">
        <svg class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"/></svg>
      </div>
      <h1 class="mt-6 text-3xl font-semibold leading-tight tracking-tight">SIMPERA v2</h1>
      <p class="mt-2 max-w-xs text-emerald-50/90">
        Verifikasi dan disposisi surat langsung dari ponsel, memakai akun e-surat Anda.
      </p>
    </div>

    <form id="m-form-login" class="relative mt-10 space-y-4" novalidate>
      <div>
        <label for="m-username" class="mb-1.5 block text-sm font-medium text-emerald-50">Username</label>
        <input id="m-username" name="username" type="text" autocomplete="username" required
               class="w-full rounded-2xl border border-white/25 bg-white/15 px-4 py-3.5 text-white placeholder-emerald-100/60 backdrop-blur focus:border-white/60 focus:outline-none focus:ring-2 focus:ring-white/30"
               placeholder="username e-surat">
      </div>
      <div>
        <label for="m-password" class="mb-1.5 block text-sm font-medium text-emerald-50">Kata sandi</label>
        <div class="relative">
          <input id="m-password" name="password" type="password" autocomplete="current-password" required
                 class="w-full rounded-2xl border border-white/25 bg-white/15 px-4 py-3.5 pr-12 text-white placeholder-emerald-100/60 backdrop-blur focus:border-white/60 focus:outline-none focus:ring-2 focus:ring-white/30"
                 placeholder="••••••••">
          <button type="button" id="m-lihat-sandi" aria-label="Tampilkan kata sandi"
                  class="absolute inset-y-0 right-0 grid w-12 place-items-center text-emerald-100/80">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
          </button>
        </div>
      </div>

      <p id="m-login-error" class="hidden rounded-2xl bg-rose-500/20 px-4 py-3 text-sm text-rose-50 ring-1 ring-rose-200/40"></p>

      <button type="submit" id="m-login-submit"
              class="flex w-full items-center justify-center gap-2 rounded-2xl bg-white py-3.5 text-base font-semibold text-brand-700 shadow-lg shadow-brand-900/20 active:scale-[.99]">
        <span class="m-label">Masuk</span>
        <svg class="m-spin hidden h-5 w-5 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4z"/></svg>
      </button>
    </form>

    <p class="relative mt-8 text-center text-xs text-emerald-100/70">
      Tambahkan ke layar utama untuk membukanya seperti aplikasi biasa.
    </p>
  </div>
</section>

<!-- ===================== APLIKASI ===================== -->
<section id="m-app" class="hidden min-h-full pb-24">
  <!-- Puncak hijau: identitas pemakai, satu tombol tindakan, lalu tiga
       angka yang benar-benar jadi pekerjaannya hari ini. Lembar putih di
       bawahnya naik menutupi sebagian puncak, jadi daftar surat terbaca
       sebagai bidang tenang yang terpisah dari panel berwarna. -->
  <header class="puncak">
    <div class="puncak-baris">
      <button type="button" id="m-avatar" class="puncak-avatar" aria-label="Akun">?</button>
      <div class="puncak-id">
        <p id="m-nama" class="puncak-nama">—</p>
        <p id="m-jabatan" class="puncak-peran">—</p>
      </div>
      <button type="button" id="m-bell" class="puncak-tombol" aria-label="Notifikasi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10.27 21a2 2 0 0 0 3.46 0"/>
          <path d="M3.26 15.33A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.67C19.41 13.96 18 12.5 18 8A6 6 0 0 0 6 8c0 4.5-1.41 5.96-2.74 7.33"/>
        </svg>
        <span>Notifikasi</span>
        <span id="m-bell-badge" class="puncak-angka-kecil hidden"></span>
      </button>
    </div>
    <div id="m-angka" class="puncak-petak"></div>
  </header>

  <!-- Lembar isi -->
  <div class="lembaran">
    <div class="cari-kotak">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/>
      </svg>
      <input id="m-cari" type="search" autocomplete="off" placeholder="Cari surat, nomor, pengirim" aria-label="Cari surat">
    </div>

    <div id="m-chip"></div>

    <div class="bagian-baris">
      <p id="m-judul" class="bagian-label">Surat masuk</p>
      <p id="m-subjudul" class="bagian-hitung"></p>
    </div>

    <main id="m-page"></main>
  </div>
</section>

<!-- Navigasi bawah -->
<nav id="m-nav" class="fixed inset-x-0 bottom-0 z-30 hidden border-t border-slate-200 bg-white/95 pb-[env(safe-area-inset-bottom)] backdrop-blur">
  <div class="grid grid-cols-4"></div>
</nav>

<!-- Lembar geser & toast -->
<!-- Lembar geser. Satu kolom flex: kepala dan kaki tetap, badan yang
     menggulir — supaya tombol keputusan selalu terjangkau tanpa perlu
     menggulir sampai ujung. -->
<div id="m-sheet" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" data-sheet-close></div>
  <div class="lembar">
    <div class="lembar-kepala">
      <span class="lembar-grip" data-sheet-close></span>
      <div class="lembar-baris">
        <p id="m-sheet-title" class="lembar-judul">Detail</p>
        <button type="button" data-sheet-close class="lembar-tutup" aria-label="Tutup">
          <svg class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div id="m-sheet-body" class="lembar-isi"></div>
    <div id="m-sheet-kaki" class="lembar-kaki hidden"></div>
  </div>
</div>

<!-- Penampil lampiran. Berkas dibuka di dalam aplikasi, bukan diunduh
     diam-diam; tombol di kaki menyediakan jalan keluar bila penampil
     bawaan peramban bermasalah. -->
<div id="m-berkas" class="fixed inset-0 z-[70] hidden flex flex-col bg-slate-900/95 backdrop-blur-sm">
  <div class="flex items-center gap-3 px-4 pb-3 pt-[calc(env(safe-area-inset-top)+.75rem)] text-white">
    <button type="button" data-berkas-close class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-white/15" aria-label="Tutup lampiran">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
    </button>
    <div class="min-w-0 flex-1">
      <p id="m-berkas-nama" class="truncate text-sm font-medium">Lampiran</p>
      <p id="m-berkas-ukuran" class="text-[11px] text-white/60"></p>
    </div>
  </div>
  <div id="m-berkas-isi" class="min-h-0 flex-1 overflow-auto bg-white"></div>
  <div id="m-berkas-kaki" class="hidden flex gap-2 px-4 pb-[calc(env(safe-area-inset-bottom)+.75rem)] pt-3">
    <a id="m-berkas-tab" href="#" target="_blank" rel="noopener"
       class="flex flex-1 items-center justify-center gap-2 rounded-2xl bg-white/15 py-3 text-sm font-medium text-white">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.2A2.2 2.2 0 0 0 3 8.2v10.6A2.2 2.2 0 0 0 5.2 21h10.6a2.2 2.2 0 0 0 2.2-2.2V10.5M21 3h-6m6 0v6m0-6-9 9"/></svg>
      Buka di tab baru
    </a>
    <a id="m-berkas-unduh" href="#"
       class="flex flex-1 items-center justify-center gap-2 rounded-2xl bg-white py-3 text-sm font-semibold text-slate-900">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
      Unduh
    </a>
  </div>
</div>

<div id="m-toasts" class="pointer-events-none fixed inset-x-4 bottom-24 z-[60] flex flex-col gap-2"></div>

<div id="m-boot" class="grid min-h-screen place-items-center">
  <div class="flex items-center gap-3 text-slate-400">
    <svg class="h-5 w-5 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4z"/></svg>
    <span class="text-sm">Memuat…</span>
  </div>
</div>

<script src="app.js?v=8efd9c8eef"></script>
</body>
</html>
