# =============================================================================
# Vhost domain simpera.unisma.ac.id
#
# Blok ini BERDIRI SENDIRI: vhost program-unggulan.unisma.ac.id di
# sites-available/default tidak diubah sebaris pun, jadi aplikasi "program",
# /esurat/, /hls/ dan /public/cctv_app/ tetap persis seperti sekarang.
# e-surat.unisma.ac.id menunjuk ke mesin lain (114.7.136.204), jadi tidak ada
# yang bisa dipengaruhi dari server ini.
#
# Jalur URL sengaja dibuat SAMA dengan yang lama (/simpera-v2/...). Alasannya:
# manifest PWA memakai path mutlak "/simpera-v2/m/" sebagai scope dan
# start_url. Kalau aplikasi dipindah ke akar domain, aplikasi yang sudah
# terpasang di ponsel pemakai akan lepas dari scope-nya. Dengan jalur yang
# sama, dua domain melayani berkas yang sama tanpa perubahan kode apa pun.
#
# Pasang: lihat pasang-domain-simpera.sh di folder yang sama.
# =============================================================================

server {
	listen 80;
	listen [::]:80;
	server_name simpera.unisma.ac.id;

	root /var/www/html/simpera-v2/frontend;
	index index.html;

	client_max_body_size 32M;

	access_log /var/log/nginx/simpera-access.log;
	error_log  /var/log/nginx/simpera-error.log;

	# Akar domain langsung ke aplikasi; ponsel diarahkan ke versi PWA-nya
	# oleh halaman itu sendiri, sama seperti di domain lama.
	location = / { return 301 /simpera-v2/; }

	# ================= SIMPERA v2 =================
	location ^~ /simpera-v2/api {
		proxy_pass         http://127.0.0.1:8123/api;
		proxy_http_version 1.1;
		proxy_set_header   Host              $host;
		proxy_set_header   X-Real-IP         $remote_addr;
		proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header   X-Forwarded-Proto $scheme;
		client_max_body_size 32M;
		proxy_read_timeout 120s;
	}

	location = /simpera-v2 { return 301 /simpera-v2/; }

	location ^~ /simpera-v2/ {
		alias /var/www/html/simpera-v2/frontend/;
		index index.html;
		try_files $uri $uri/ =404;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy        "same-origin" always;

		location ~* \.(html|webmanifest)$ {
			add_header Cache-Control "no-cache, must-revalidate" always;
		}
		location ~* \.(js|css)$ {
			add_header Cache-Control "public, max-age=31536000, immutable" always;
		}
		# Service worker tidak boleh disimpan lama, kalau tidak pembaruan
		# aplikasi tidak pernah sampai ke ponsel.
		location = /simpera-v2/m/sw.js {
			add_header Cache-Control "no-cache, must-revalidate" always;
		}
		location ~ /\.(env|git) { return 404; }
	}

	# Domain ini hanya untuk SIMPERA. Apa pun di luar itu bukan urusannya.
	location / { return 404; }
}
