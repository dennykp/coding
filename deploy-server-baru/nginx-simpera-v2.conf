# ============================================================================
# SIMPERA v2 di server program-unggulan (15.232.15.85)
#
# Disisipkan ke DALAM server block yang sudah ada di
# /etc/nginx/sites-available/default (server_name program-unggulan.unisma.ac.id),
# tepat sebelum "location / {".
#
# Ini padanan nginx dari frontend/.htaccess milik server lama. Perilakunya
# disamakan satu per satu; lihat komentar tiap bagian.
# ============================================================================

	# --- API Python (uvicorn) ---
	# Padanan: RewriteRule ^api/(.*)$ http://127.0.0.1:8123/api/$1 [P,L,QSA]
	# Header Authorization diteruskan otomatis oleh proxy_pass, jadi tidak
	# perlu aturan khusus seperti di Apache.
	location ^~ /simpera-v2/api {
		proxy_pass         http://127.0.0.1:8123/api;
		proxy_http_version 1.1;
		proxy_set_header   Host              $host;
		proxy_set_header   X-Real-IP         $remote_addr;
		proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header   X-Forwarded-Proto $scheme;

		# Unggah lampiran lewat API. MAX_UPLOAD_MB di backend default 25,
		# jadi batas nginx dibuat lebih longgar sedikit.
		client_max_body_size 32M;

		# Laporan/ekspor bisa lama.
		proxy_read_timeout 120s;
	}

	# --- Frontend statis ---
	location ^~ /simpera-v2/ {
		alias /var/www/html/simpera-v2/frontend/;
		index index.html;

		# Rute SPA memakai hash (#/...), jadi TIDAK perlu fallback ke
		# index.html seperti Laravel. 404 untuk berkas yang benar-benar
		# tidak ada memang perilaku yang diinginkan.
		try_files $uri $uri/ =404;

		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy        "same-origin" always;

		# Halaman selalu diperiksa ulang, supaya index.html lama tidak
		# bertahan di peramban dan merujuk berkas versi lama.
		location ~* \.(html|webmanifest)$ {
			add_header Cache-Control "no-cache, must-revalidate" always;
		}

		# js/css dirujuk dengan penanda versi (?v=<sidik isi>) dari
		# build/stamp.js, jadi aman disimpan lama.
		location ~* \.(js|css)$ {
			add_header Cache-Control "public, max-age=31536000, immutable" always;
		}

		# Service worker harus selalu segar; ditaruh setelah aturan js
		# supaya menang atas aturan di atasnya.
		location = /simpera-v2/pwa/sw.js {
			add_header Cache-Control "no-cache, must-revalidate" always;
		}

		# Jangan pernah sajikan berkas konfigurasi.
		location ~ /\.(env|git) {
			return 404;
		}
	}

	# Tanpa garis miring -> arahkan ke versi dengan garis miring.
	location = /simpera-v2 {
		return 301 /simpera-v2/;
	}
